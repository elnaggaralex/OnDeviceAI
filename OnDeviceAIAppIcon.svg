<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5145D8"/>
      <stop offset="0.52" stop-color="#22265F"/>
      <stop offset="1" stop-color="#0D536D"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.48" cy="0.48" r="0.65">
      <stop offset="0" stop-color="#8B7CFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4C55D9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCEBFF"/>
    </linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5A4CE1"/>
      <stop offset="1" stop-color="#28B7C7"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#60E5E0"/>
      <stop offset="0.56" stop-color="#A4B7FF"/>
      <stop offset="1" stop-color="#E6C5FF"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="24"/>
      <feOffset dy="24"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.34"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#background)"/>
  <rect width="1024" height="1024" fill="url(#aura)"/>

  <!-- Quiet circuit traces suggest the intelligence runs locally on the device. -->
  <g fill="none" stroke="#C9D4FF" stroke-opacity="0.19" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M126 358h70q34 0 34 34v28"/>
    <path d="M898 666h-70q-34 0-34-34v-28"/>
    <path d="M666 126v70q0 34-34 34h-28"/>
    <path d="M358 898v-70q0-34 34-34h28"/>
  </g>
  <g fill="#B9E9FF" fill-opacity="0.78">
    <circle cx="126" cy="358" r="8"/><circle cx="898" cy="666" r="8"/>
    <circle cx="666" cy="126" r="8"/><circle cx="358" cy="898" r="8"/>
  </g>

  <!-- A page with a photo and readable lines represents the app's file and vision tasks. -->
  <g filter="url(#shadow)">
    <rect x="252" y="190" width="520" height="644" rx="92" fill="url(#paper)"/>
  </g>
  <rect x="306" y="246" width="86" height="86" rx="27" fill="#5547D8"/>
  <path d="M350 265c4 20 13 29 33 33-20 4-29 13-33 33-4-20-13-29-33-33 20-4 29-13 33-33Z" fill="#FFFFFF"/>
  <rect x="420" y="263" width="222" height="17" rx="8.5" fill="#363B73" opacity="0.84"/>
  <rect x="420" y="295" width="166" height="13" rx="6.5" fill="#8D96BD" opacity="0.65"/>

  <rect x="306" y="378" width="412" height="20" rx="10" fill="#7580A8" opacity="0.58"/>
  <rect x="306" y="416" width="350" height="16" rx="8" fill="#9AA4C4" opacity="0.55"/>
  <rect x="306" y="449" width="280" height="16" rx="8" fill="#9AA4C4" opacity="0.42"/>

  <rect x="306" y="501" width="412" height="270" rx="38" fill="url(#photo)"/>
  <circle cx="620" cy="568" r="31" fill="#FFE6A6"/>
  <path d="M324 720 438 596l86 91 65-67 111 115v18H324Z" fill="#D8F5FF" fill-opacity="0.94"/>
  <path d="m324 739 104-100 67 66 41-39 101 105H324Z" fill="#9CE5E7" fill-opacity="0.93"/>

  <!-- The bright four-point spark marks AI understanding across both text and images. -->
  <g filter="url(#glow)">
    <path d="M776 244c15 75 35 95 110 110-75 15-95 35-110 110-15-75-35-95-110-110 75-15 95-35 110-110Z" fill="url(#spark)"/>
    <circle cx="876" cy="246" r="13" fill="#D7FBFF"/>
    <circle cx="676" cy="456" r="9" fill="#B9C9FF"/>
  </g>
</svg>
